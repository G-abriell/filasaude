<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Filas')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu('filas')}"></nav>
    <main class="conteudo">
        <header class="cabecalho-pagina">
            <div>
                <h1>Filas</h1>
                <p>Cada fila é um tipo de atendimento. A letra da sigla abre a senha, como A001.</p>
            </div>
            <a class="btn btn-primario" th:href="@{/filas/novo}">Cadastrar fila</a>
        </header>

        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <p th:if="${#lists.isEmpty(filas)}" class="estado-vazio">Nenhuma fila cadastrada. Cadastre a primeira para começar a gerar senhas.</p>
        <div class="tabela-caixa" th:unless="${#lists.isEmpty(filas)}">
            <table class="tabela">
                <thead><tr><th>Sigla</th><th>Nome</th><th>Descrição</th><th>Situação</th><th><span class="visualmente-oculto">Ações</span></th></tr></thead>
                <tbody>
                <tr th:each="f : ${filas}">
                    <td class="num" th:text="${f.sigla}">A</td>
                    <td th:text="${f.nome}">Consulta</td>
                    <td th:text="${f.descricao} ?: '—'">—</td>
                    <td th:classappend="${!f.ativa} ? 'apoio'" th:text="${f.ativa} ? 'Em uso' : 'Desativada'">Em uso</td>
                    <td class="acoes-celula">
                        <div class="acoes">
                            <a class="btn btn-secundario btn-compacto" th:href="@{/filas/{id}/editar(id=${f.id})}">Editar</a>
                            <form method="post" th:action="@{/filas/{id}/alternar-ativa(id=${f.id})}"
                                  th:data-confirmar="${f.ativa} ? |Desativar a fila ${f.nome}?| : null"
                                  data-consequencia="A recepção não poderá mais adicionar pacientes a esta fila."
                                  data-acao="Sim, desativar">
                                <button class="btn btn-secundario btn-compacto" th:text="${f.ativa} ? 'Desativar' : 'Reativar'">Desativar</button>
                            </form>
                            <form method="post" th:action="@{/filas/{id}/excluir(id=${f.id})}"
                                  th:data-confirmar="|Excluir a fila ${f.nome}?|"
                                  data-consequencia="A fila será apagada e não poderá ser recuperada."
                                  data-acao="Sim, excluir">
                                <button class="btn btn-secundario btn-compacto">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<dialog th:replace="~{fragments/layout :: confirmacao}"></dialog>
</body>
</html>
