<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | FilaSaúde'">FilaSaúde</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
        nav { background: #0b6e4f; padding: 12px 24px; display: flex; gap: 18px; flex-wrap: wrap; }
        nav a { color: #fff; text-decoration: none; font-weight: 500; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 8px 10px; border-bottom: 1px solid #e3e6ea; text-align: left; }
        form.inline { display: inline; }
        label { display: block; margin-top: 12px; font-weight: 500; }
        input, select, textarea { padding: 6px 8px; min-width: 260px; }
        button, .btn { padding: 6px 12px; border: 0; border-radius: 4px; background: #0b6e4f; color: #fff; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-sec { background: #6c757d; }
        .btn-perigo { background: #b02a37; }
        .alerta { padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; }
        .sucesso { background: #d1e7dd; }
        .erro { background: #f8d7da; }
        .campo-erro { color: #b02a37; font-size: .9em; }
        .preferencial { font-weight: bold; color: #b35c00; }
    </style>
</head>
<body>
<nav th:fragment="menu">
    <a th:href="@{/atendimentos/guiche}">Guichê</a>
    <a th:href="@{/atendimentos/novo}">Emitir senha</a>
    <a th:href="@{/atendimentos}">Atendimentos do dia</a>
    <a th:href="@{/pacientes}">Pacientes</a>
    <a th:href="@{/filas}">Filas</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/perfis}">Perfis</a>
</nav>

<div th:fragment="mensagens">
    <div class="alerta sucesso" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alerta erro" th:if="${erro}" th:text="${erro}"></div>
</div>
</body>
</html>
