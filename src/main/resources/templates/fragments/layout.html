<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · FilaSaúde'">FilaSaúde</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <!-- Tema claro por padrão; aplica o escuro antes de desenhar, se a pessoa escolheu -->
    <script>
        try {
            if (localStorage.getItem('filasaude-tema') === 'escuro') {
                document.documentElement.setAttribute('data-tema', 'escuro');
            }
        } catch (e) { /* sem armazenamento: fica no tema claro */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Figtree:wght@400..700&display=swap">
    <link rel="stylesheet" th:href="@{/css/filasaude.css}">
    <script defer th:src="@{/js/filasaude.js}"></script>
</head>
<body>

<!-- Marca: F construído com barras de fila. A barra superior é sempre cobre. -->
<svg th:fragment="marca" class="marca" viewBox="0 0 44.8 46.4" aria-hidden="true" focusable="false">
    <rect class="marca-haste" x="0" y="0" width="10.66" height="46.4" rx="5.33"/>
    <rect class="marca-vez" x="14.93" y="0" width="29.86" height="10.55" rx="5.275"/>
    <rect class="marca-haste" x="14.93" y="17.93" width="19.19" height="10.55" rx="5.275"/>
    <circle class="marca-ponto" cx="20.26" cy="41.13" r="5.3"/>
</svg>

<!--
  Navegação lateral. O parâmetro "ativo" marca o item da tela atual:
  recepcao, atendimento, dia, pacientes, filas, usuarios, perfis, configuracoes.
-->
<nav th:fragment="menu(ativo)" class="nav-lateral" aria-label="Navegação principal">
    <a class="assinatura" th:href="@{/inicio}" aria-label="FilaSaúde, página inicial">
        <svg th:replace="~{fragments/layout :: marca}"></svg>
        <span class="assinatura-nome" aria-hidden="true">FilaSaúde</span>
    </a>
    <ul class="nav-itens">
        <li sec:authorize="hasAnyRole('RECEPCAO', 'ADMIN')">
            <a th:href="@{/atendimentos/novo}" th:classappend="${ativo == 'recepcao'} ? 'ativo'"
               th:aria-current="${ativo == 'recepcao'} ? 'page'">Adicionar à fila</a>
        </li>
        <li sec:authorize="hasAnyRole('PROFISSIONAL_DE_SAUDE', 'ADMIN')">
            <a th:href="@{/atendimentos/guiche}" th:classappend="${ativo == 'atendimento'} ? 'ativo'"
               th:aria-current="${ativo == 'atendimento'} ? 'page'">Atendimento</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/atendimentos}" th:classappend="${ativo == 'dia'} ? 'ativo'"
               th:aria-current="${ativo == 'dia'} ? 'page'">Atendimentos do dia</a>
        </li>
        <li sec:authorize="hasAnyRole('RECEPCAO', 'ADMIN')">
            <a th:href="@{/pacientes}" th:classappend="${ativo == 'pacientes'} ? 'ativo'"
               th:aria-current="${ativo == 'pacientes'} ? 'page'">Pacientes</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/filas}" th:classappend="${ativo == 'filas'} ? 'ativo'"
               th:aria-current="${ativo == 'filas'} ? 'page'">Filas</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/usuarios}" th:classappend="${ativo == 'usuarios'} ? 'ativo'"
               th:aria-current="${ativo == 'usuarios'} ? 'page'">Usuários</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/perfis}" th:classappend="${ativo == 'perfis'} ? 'ativo'"
               th:aria-current="${ativo == 'perfis'} ? 'page'">Perfis</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/configuracoes}" th:classappend="${ativo == 'configuracoes'} ? 'ativo'"
               th:aria-current="${ativo == 'configuracoes'} ? 'page'">Configurações</a>
        </li>
    </ul>
    <button th:replace="~{fragments/layout :: botao-tema}"></button>
    <div class="nav-usuario" sec:authorize="isAuthenticated()">
        <span class="nav-usuario-nome" sec:authentication="principal.nome">Nome</span>
        <form method="post" th:action="@{/logout}">
            <button class="btn btn-secundario btn-compacto">Sair</button>
        </form>
    </div>
</nav>

<!-- Alternar entre tema claro e escuro (filasaude.js) -->
<button th:fragment="botao-tema" type="button" class="botao-tema" data-alternar-tema aria-pressed="false">
    <svg class="icone icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
    <svg class="icone icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span data-rotulo-tema>Tema escuro</span>
</button>

<!-- Mensagens: sucesso confirma o que aconteceu, erro diz o que fazer. -->
<div th:fragment="mensagens" th:remove="tag">
    <div class="mensagem mensagem-sucesso" role="status" th:if="${sucesso}">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span th:text="${sucesso}">Paciente salvo.</span>
    </div>
    <div class="mensagem mensagem-erro" role="alert" th:if="${erro}">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
        <span th:text="${erro}">Não foi possível salvar. Confira os campos em destaque.</span>
    </div>
</div>

<!-- Etiqueta de status: sempre com a palavra escrita. -->
<span th:fragment="status(s)" class="status"
      th:classappend="${s.name() == 'AGUARDANDO'} ? 'status-aguardando'
                    : (${s.name() == 'CHAMADO' or s.name() == 'EM_ATENDIMENTO'} ? 'status-atendimento'
                    : (${s.name() == 'FINALIZADO'} ? 'status-concluido' : 'status-neutro'))">
    <svg th:if="${s.name() == 'FINALIZADO'}" class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
    <span th:text="${s.descricao}">Aguardando</span>
</span>

<!-- Erro de validação de um campo: texto dizendo o que fazer, nunca só a borda. -->
<p th:fragment="erro-campo(campo)" class="msg-erro-campo" th:if="${#fields.hasErrors(campo)}">
    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
    <span th:errors="*{__${campo}__}">Preencha este campo para continuar.</span>
</p>

<!-- Janela de confirmação crítica, usada por filasaude.js -->
<dialog th:fragment="confirmacao" id="confirmacao" class="confirmacao" aria-labelledby="confirmacao-titulo">
    <form method="dialog">
        <h2 id="confirmacao-titulo" data-confirmacao-titulo>Confirmar?</h2>
        <p data-confirmacao-texto></p>
        <div class="acoes-formulario">
            <button class="btn btn-secundario" value="voltar">Voltar</button>
            <button class="btn btn-primario" value="sim" data-confirmacao-sim>Confirmar</button>
        </div>
    </form>
</dialog>

</body>
</html>
