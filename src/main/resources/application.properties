spring.application.name=filasaude
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/filasaude_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Usuário administrador criado na primeira execução (se ainda não existir).
# Defina FILASAUDE_ADMIN_SENHA no ambiente; troque a senha após o primeiro login.
filasaude.admin.nome=Administrador
filasaude.admin.email=${FILASAUDE_ADMIN_EMAIL:admin@filasaude.com}
filasaude.admin.senha=${FILASAUDE_ADMIN_SENHA:123456}
